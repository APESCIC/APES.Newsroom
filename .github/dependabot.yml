version: 2

# Weekly grouped updates into the long-lived dependencies branch, never into main. They reach main in the
# next milestone's single merge (see .cursor/rules/version-shipping.mdc).

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composer:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    target-branch: dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
