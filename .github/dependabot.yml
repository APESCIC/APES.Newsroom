version: 2

# Weekly grouped updates into the long-lived dependencies branch, never into main. They reach main in the
# next milestone's single merge (see .cursor/rules/version-shipping.mdc).

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "skip-changelog"]
    groups:
      composer-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    target-branch: dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "skip-changelog"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    # Planned migrations: Inertia 3 (#793) and TypeScript 7 (#794).
    ignore:
      - dependency-name: "@inertiajs/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "skip-changelog"]
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
