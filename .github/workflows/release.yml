name: GitHub Release

# Publish a GitHub Release when a version tag is pushed. This is not a
# deploy: it never calls Cloudron, never backs up or restarts the app,
# and never runs on push to main. Deploy stays the manual workflow in
# deploy.yml (issue #3).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
