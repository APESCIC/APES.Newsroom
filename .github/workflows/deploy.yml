name: Deploy to Cloudron (beta)

# Manually triggered on purpose. Deploys the live Cloudron LAMP Newsroom at
# https://www.apesnews.org.uk/ (app id 74a2a784-a161-4787-84ff-2b8efc957bc8).  # pragma: allowlist secret
# The GitHub Environment name remains "beta" (existing secrets/reviewers); that
# environment targets the live app. Ops must set CLOUDRON_APP_ORIGIN_HOST to
# www.apesnews.org.uk for the health check. Issue #3 requires deployment to be a  # pragma: allowlist secret
# deliberate, guarded action rather than an automatic side effect of merging to
# main. Do not add merge-auto-deploy.
on:
  workflow_dispatch:
    inputs:
      confirm_branch:
        description: 'Type the branch you intend to deploy (must be "main")'
        required: true

permissions:
  contents: read

concurrency:
  # Never run two deploys to the same target concurrently.
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy-beta:
    name: Deploy beta
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Verify branch and inputs
        run: |
          if [ "${{ inputs.confirm_branch }}" != "main" ]; then
            echo "::error::confirm_branch must be 'main', got '${{ inputs.confirm_branch }}'"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::This workflow must be run against the main branch (got ${{ github.ref_name }})"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Include run_id so re-deploying the same git SHA never sync-pushes into an
      # already-activated release directory (activate replaces storage/app with a
      # symlink to shared storage; cloudron sync then fails with cross-device link).
      - name: Resolve release identifier
        id: release
        run: echo "sha=$(git rev-parse --short=12 HEAD)-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, redis, pdo_mysql, bcmath, intl, zip, gd, opcache
          coverage: none
          tools: composer:v2

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies and build
        run: |
          npm ci
          npm run build

      - name: Assemble versioned release artifact
        run: |
          set -euo pipefail
          RELEASE_DIR="release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          # Whitelist what ships. No .git, no tests, no node_modules, no
          # dev-only tooling, no committed .env - matches "do not build
          # dependencies interactively in production" and "never commit
          # credentials".
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='release' \
            --exclude='.env' \
            --exclude='storage/framework/cache/data' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/logs' \
            ./ "$RELEASE_DIR"/

          mkdir -p \
            "$RELEASE_DIR"/storage/framework/cache/data \
            "$RELEASE_DIR"/storage/framework/sessions \
            "$RELEASE_DIR"/storage/framework/views \
            "$RELEASE_DIR"/storage/logs \
            "$RELEASE_DIR"/bootstrap/cache

          # Empty dirs are dropped by cloudron sync push; keep placeholders.
          touch \
            "$RELEASE_DIR"/storage/framework/sessions/.gitkeep \
            "$RELEASE_DIR"/storage/framework/views/.gitkeep \
            "$RELEASE_DIR"/storage/framework/cache/data/.gitkeep \
            "$RELEASE_DIR"/bootstrap/cache/.gitkeep

      - name: Install Cloudron CLI
        run: npm install -g cloudron

      - name: Create blocking app backup
        run: >
          cloudron --server "${{ secrets.CLOUDRON_FQDN }}" --token "${{ secrets.CLOUDRON_TOKEN }}"
          backup create --app "${{ secrets.CLOUDRON_APP_ID }}"

      - name: Upload versioned release
        run: >
          cloudron --server "${{ secrets.CLOUDRON_FQDN }}" --token "${{ secrets.CLOUDRON_TOKEN }}"
          sync push --app "${{ secrets.CLOUDRON_APP_ID }}"
          ./release/ "/app/data/releases/${{ steps.release.outputs.sha }}/"

      - name: Migrate and activate release
        id: activate
        run: >
          cloudron --server "${{ secrets.CLOUDRON_FQDN }}" --token "${{ secrets.CLOUDRON_TOKEN }}"
          exec --app "${{ secrets.CLOUDRON_APP_ID }}" --
          bash "/app/data/releases/${{ steps.release.outputs.sha }}/deploy/cloudron-activate.sh"
          "${{ steps.release.outputs.sha }}"

      - name: Restart app (picks up new code for queue worker + Apache)
        id: restart
        if: steps.activate.outcome == 'success'
        run: >
          cloudron --server "${{ secrets.CLOUDRON_FQDN }}" --token "${{ secrets.CLOUDRON_TOKEN }}"
          restart --app "${{ secrets.CLOUDRON_APP_ID }}"

      - name: Health check
        id: health
        if: steps.restart.outcome == 'success'
        run: |
          set -e
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ secrets.CLOUDRON_APP_ORIGIN_HOST }}/health" | grep -q '"status":"ok"'; then
              echo "Healthy."
              exit 0
            fi
            echo "Not healthy yet, retrying ($i/10)..."
            sleep 6
          done
          echo "::error::Health check did not pass within timeout."
          exit 1

      - name: Roll back on failed activation, restart, or health check
        if: |
          always() &&
          (steps.activate.outcome == 'failure' || steps.restart.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          cloudron --server "${{ secrets.CLOUDRON_FQDN }}" --token "${{ secrets.CLOUDRON_TOKEN }}" \
            exec --app "${{ secrets.CLOUDRON_APP_ID }}" -- \
            bash /app/data/current/deploy/cloudron-rollback.sh || true
          cloudron --server "${{ secrets.CLOUDRON_FQDN }}" --token "${{ secrets.CLOUDRON_TOKEN }}" \
            restart --app "${{ secrets.CLOUDRON_APP_ID }}" || true
          echo "::error::Deploy failed and rollback was attempted. Verify beta manually - do not assume rollback succeeded."
          exit 1
