name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; individual jobs do not need write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, redis, pdo_mysql, pdo_sqlite, bcmath, intl, zip, gd, opcache
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets for backend tests
        run: |
          npm ci
          npm run build

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static config check
        run: php artisan config:clear

      - name: Security audit (composer)
        run: composer audit

      - name: Test
        run: vendor/bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Component tests
        run: npm run test:frontend

      - name: Security audit (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 7

  e2e:
    name: Panels and public site (screenshots and accessibility)
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      APP_URL: http://127.0.0.1:8012
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: 4
      E2E_BASE_URL: http://127.0.0.1:8012
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, pdo_sqlite, bcmath, intl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare seeded app
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          echo "DB_DATABASE=$GITHUB_WORKSPACE/database/e2e.sqlite" >> "$GITHUB_ENV"
          touch database/e2e.sqlite
          DB_DATABASE="$GITHUB_WORKSPACE/database/e2e.sqlite" php artisan migrate:fresh --force --seeder='Database\Seeders\VisualRegressionSeeder'

      - name: Start app
        run: |
          php artisan serve --host=127.0.0.1 --port=8012 > storage/logs/e2e-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8012/health && exit 0; sleep 1; done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test panels public

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
            tests/e2e/__screenshots__/linux
            storage/logs
          retention-days: 7

  changelog:
    name: Changelog gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, redis, pdo_sqlite, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Require changelog entry (or skip-changelog label)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >
          php artisan newsroom:check-pr-changelog
          --base=origin/${{ github.base_ref }}
          --labels="${PR_LABELS}"
