# Manual Apache virtual host for APES Newsroom in Laragon.
#
# Only needed when Laragon's Auto Virtual Hosts is turned off. With it on,
# Laragon generates C:\laragon\etc\apache2\sites-enabled\auto.apes-newsroom.test.conf
# with the same document root (public/) and this file is not used.
#
# To use it, copy it to C:\laragon\etc\apache2\sites-enabled\apes-newsroom.test.conf
# (no "auto." prefix, so Laragon leaves it alone), then Menu > Apache > Reload.

define ROOT "C:/laragon/www/apes-newsroom/public"
define SITE "apes-newsroom.test"

<VirtualHost *:80>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile   C:/laragon/etc/ssl/laragon.key
</VirtualHost>
